<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cooperación vs Competencia - Final del futbol Colombiano 2024-1</title>
  <style>
:root {
  color-scheme: dark;
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #050505;
  color: #f1f1f1;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #000;
}

.app-shell {
  display: grid;
  grid-template-columns: 1fr 360px;
  min-height: 100vh;
}

.canvas-panel {
  position: relative;
  background: #000;
}

#simCanvas {
  width: 100%;
  height: 100vh;
  display: block;
}

.overlay-stats {
  position: absolute;
  left: 16px;
  top: 16px;
  display: grid;
  gap: 8px;
  padding: 12px;
  background: rgba(0, 0, 0, 0.45);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 12px;
  backdrop-filter: blur(6px);
}

.stat {
  font-size: 0.92rem;
}

.legend {
  position: absolute;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  padding: 12px 16px;
  background: rgba(0, 0, 0, 0.45);
  border-radius: 12px;
  border: 1px solid rgba(255, 255, 255, 0.08);
  z-index: 10;
}

.legend-item {
  display: inline-flex;
  align-items: center;
  padding: 6px 10px;
  border-radius: 999px;
  font-size: 0.85rem;
}

.legend-nacional { background: rgba(30, 220, 80, 0.18); color: #8cf58b; }
.legend-santa-fe { background: rgba(255, 60, 60, 0.16); color: #ff8a8a; }
.legend-bucaramanga { background: rgba(255, 225, 65, 0.18); color: #fff381; }
.legend-millonarios { background: rgba(80, 145, 255, 0.18); color: #a8c8ff; }
.legend-la-equidad { background: rgba(255, 255, 255, 0.18); color: #ffffff; }

.sidebar {
  background: #090909;
  border-left: 1px solid rgba(255, 255, 255, 0.06);
  overflow-y: auto;
}

.panel {
  padding: 24px;
  max-width: 360px;
}

h1 {
  margin: 0 0 12px;
  font-size: 1.55rem;
}

.panel-description {
  margin: 0 0 24px;
  color: #b8b8c2;
  line-height: 1.6;
}

.control-group {
  margin-bottom: 24px;
}

.control-group h2 {
  margin: 0 0 14px;
  font-size: 0.95rem;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  color: #d0d0d8;
}

label {
  display: grid;
  gap: 8px;
  margin-bottom: 12px;
  font-size: 0.92rem;
  color: #dfe0e5;
}

input[type="range"] {
  width: 100%;
  accent-color: #61c8ff;
}

input[type="number"], select {
  width: 100%;
  padding: 10px 12px;
  border-radius: 14px;
  border: 1px solid rgba(255, 255, 255, 0.10);
  background: #111;
  color: #f1f1f1;
}

input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

button {
  width: 100%;
  padding: 12px 14px;
  border: 0;
  border-radius: 14px;
  background: #16161c;
  color: #f7f7f7;
  font-size: 0.95rem;
  cursor: pointer;
  transition: transform 0.15s ease, background-color 0.15s ease;
}

button:hover {
  transform: translateY(-1px);
  background: #1f1f26;
}

.button-row {
  display: grid;
  gap: 12px;
}

.matrix-table {
  overflow: hidden;
  border-radius: 18px;
  border: 1px solid rgba(255, 255, 255, 0.08);
  background: rgba(20, 20, 25, 0.9);
}

.matrix-row {
  display: grid;
  grid-template-columns: 44px repeat(5, minmax(0, 1fr));
  gap: 8px;
  padding: 8px;
  align-items: center;
}

.matrix-row.header {
  background: rgba(255, 255, 255, 0.04);
}

.matrix-label {
  width: 100%;
  display: grid;
  place-items: center;
  padding: 2px 0;

  border-radius: 14px;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.08);
  background: rgba(255, 255, 255, 0.06);
  overflow: hidden;
}

.matrix-label img {
  width: 70%;
  height: 70%;
  object-fit: contain;
}

.matrix-label.team-nacional { background: rgba(30, 220, 80, 1); }
.matrix-label.team-santa-fe { background: rgba(255, 60, 60, 1); }
.matrix-label.team-bucaramanga { background: rgba(255, 225, 65, 1); }
.matrix-label.team-millonarios { background: rgba(80, 145, 255, 1); }
.matrix-label.team-la-equidad { background: rgba(255, 255, 255, 1); }

.matrix-cell {
  position: relative;
  display: grid;
  gap: 6px;
  width: 100%;
  min-height: 60px;
  padding: 8px;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.08);
  overflow: hidden;
}

.matrix-cell input {
  width: 100%;
  height: 24px;
  accent-color: #61c8ff;
  cursor: pointer;
}

.matrix-cell:hover {
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
}

.matrix-value {
  text-align: right;
  font-size: 0.78rem;
  color: #f0f0f0;
}

@media (max-width: 1100px) {
  .app-shell {
    grid-template-columns: 1fr;
  }
  .sidebar {
    max-height: 55vh;
  }
}
  </style>
</head>
<body>
  <div class="app-shell">
    <main class="canvas-panel">
      <canvas id="simCanvas" aria-label="Simulación de partículas"></canvas>
      <div class="overlay-stats">
        <div class="stat">FPS: <span id="fpsValue">--</span></div>
        <div class="stat">Partículas: <span id="particleCount">--</span></div>
      </div>
      <div class="legend">
        <span class="legend-item legend-bucaramanga">Bucaramanga</span>
        <span class="legend-item legend-santa-fe">Santa Fe</span>
        <span class="legend-item legend-nacional">Nacional</span>
        <span class="legend-item legend-millonarios">Millonarios</span>
        <span class="legend-item legend-la-equidad">La Equidad</span>
      </div>
    </main>

    <aside class="sidebar">
      <div class="panel">
        <h1>Cooperación vs Competencia</h1>
        <p class="panel-description">Apoyo y rivalidades entre los aficionados del futbol colombiano en la copa colombiana durante el 2024-01.</p>

        <section class="control-group">
          <h2>Posiciones iniciales</h2>
          <select id="positionMode">
            <option value="random">Aleatorio</option>
            <option value="centered">Centro</option>
            <option value="circle">Circulo</option>
            <option value="clusters">Grupos</option>
          </select>
        </section>

        <section class="control-group button-row">
          <button id="pauseButton">Pausar</button>
          <button id="resumeButton">Continuar</button>
        </section>

        <section class="control-group">
          <h2>Matriz de relaciones</h2>
          <div id="matrixTable" class="matrix-table"></div>
          <div class="button-row">
            <button id="resetMatrixButton">Restablecer matriz</button>
            <button id="randomizeMatrixButton">Randomizar matriz</button>
          </div>
        </section>

        <section class="control-group team-counts">
          <h2>Cantidad por equipo</h2>
          <label>Bucaramanga <input id="count0" type="number" min="5" max="1200" step="1" /></label>
          <label>Santa Fe <input id="count1" type="number" min="5" max="1200" step="1" /></label>
          <label>Nacional <input id="count2" type="number" min="5" max="1200" step="1" /></label>
          <label>Millonarios <input id="count3" type="number" min="5" max="1200" step="1" /></label>
          <label>La Equidad <input id="count4" type="number" min="5" max="1200" step="1" /></label>
        </section>

        <section class="control-group">
          <h2>Parámetros</h2>
          <label>Radio de interacción <span id="interactionRadiusValue"></span>
            <input id="interactionRadius" type="range" min="40" max="240" step="1" />
          </label>
          <label>Fuerza máxima <span id="maxForceValue"></span>
            <input id="maxForce" type="range" min="0.01" max="0.6" step="0.01" />
          </label>
          <label>Aceleración máxima <span id="maxAccelValue"></span>
            <input id="maxAccel" type="range" min="0.05" max="2.5" step="0.05" />
          </label>
          <label>Fricción <span id="frictionValue"></span>
            <input id="friction" type="range" min="0.80" max="0.99" step="0.01" />
          </label>
          <label>Velocidad máxima <span id="maxSpeedValue"></span>
            <input id="maxSpeed" type="range" min="1" max="8" step="0.1" />
          </label>
          <label>Tamaño de partículas <span id="particleSizeValue"></span>
            <input id="particleSize" type="range" min="2" max="12" step="1" />
          </label>
        </section>

      </div>
    </aside>
  </div>

  <script>
const Config = {
  teams: [
    { name: 'Bucaramanga', color: [255, 225, 65], mass: 1.05 },
    { name: 'Santa Fe', color: [255, 60, 60], mass: 0.95 },
    { name: 'Nacional', color: [30, 220, 80], mass: 1.0 },
    { name: 'Millonarios', color: [80, 145, 255], mass: 1.0 },
    { name: 'La Equidad', color: [255, 255, 255], mass: 0.98 }
  ],
  defaultSettings: {
    interactionRadius: 130,
    maxForce: 0.18,
    maxAccel: 1.2,
    friction: 0.94,
    maxSpeed: 4.2,
    particleSize: 5,
    positionMode: 'random',
    counts: [250, 450, 600, 550, 150],
    seed: Math.floor(Date.now() % 1000000)
  }
};

const Matrix = {
  defaultValues: [
    [ 0.80, -0.90,  0.60,  0.60,  0.50],
    [-1.00,  0.20, -0.40, -0.40, -0.30],
    [ 0.50, -0.30,  0.30, -0.20,  0.20],
    [ 0.50, -0.30, -0.20,  0.30,  0.20],
    [ 0.70, -0.10,  0.30,  0.30,  0.40]
  ],
  values: [],
  initDefaults() {
    this.values = this.defaultValues.map(row => row.slice());
  },
  getValue(row, col) {
    return this.values[row][col];
  },
  setValue(row, col, value) {
    this.values[row][col] = Number(value);
  },
  randomize() {
    for (let row = 0; row < this.values.length; row++) {
      for (let col = 0; col < this.values[row].length; col++) {
        this.values[row][col] = Number((Math.random() * 2 - 1).toFixed(2));
      }
    }
  }
};

class Particle {
  constructor(type, x, y) {
    this.type = type;
    this.position = { x, y };
    this.velocity = Particle.randomVelocity();
    this.acceleration = { x: 0, y: 0 };
    this.mass = Config.teams[type].mass;
  }

  static randomVelocity() {
    const angle = (Simulation && typeof Simulation.random === 'function')
      ? Simulation.random() * Math.PI * 2
      : Math.random() * Math.PI * 2;
    return { x: Math.cos(angle), y: Math.sin(angle) };
  }

  resetAcceleration() {
    this.acceleration.x = 0;
    this.acceleration.y = 0;
  }

  applyForce(force) {
    this.acceleration.x += force.x / this.mass;
    this.acceleration.y += force.y / this.mass;
  }

  limitAcceleration(maxAccel) {
    const ax = this.acceleration.x;
    const ay = this.acceleration.y;
    const magnitude = Math.hypot(ax, ay);
    if (magnitude > maxAccel) {
      const scale = maxAccel / magnitude;
      this.acceleration.x *= scale;
      this.acceleration.y *= scale;
    }
  }

  update(maxSpeed, friction) {
    this.limitAcceleration(maxSpeed * 0.75);
    this.velocity.x += this.acceleration.x;
    this.velocity.y += this.acceleration.y;

    const speed = Math.hypot(this.velocity.x, this.velocity.y);
    if (speed > maxSpeed) {
      const scale = maxSpeed / speed;
      this.velocity.x *= scale;
      this.velocity.y *= scale;
    }

    this.velocity.x *= friction;
    this.velocity.y *= friction;

    this.position.x += this.velocity.x;
    this.position.y += this.velocity.y;
  }

  wrapEdges(width, height) {
    if (this.position.x < 0) this.position.x += width;
    if (this.position.x >= width) this.position.x -= width;
    if (this.position.y < 0) this.position.y += height;
    if (this.position.y >= height) this.position.y -= height;
  }

  display(ctx, size) {
    const color = Config.teams[this.type].color;
    ctx.fillStyle = `rgba(${color[0]}, ${color[1]}, ${color[2]}, 0.92)`;
    ctx.beginPath();
    ctx.arc(this.position.x, this.position.y, size, 0, Math.PI * 2);
    ctx.fill();
  }
}

const GPURenderer = {
  init(canvas) {
    const gl = canvas.getContext('webgl2', { antialias: false });
    if (!gl) return null;

    this.gl = gl;
    this.canvas = canvas;
    this.program = this.createProgram(gl, this.vertexShaderSource(), this.fragmentShaderSource());
    if (!this.program) return null;

    gl.useProgram(this.program);
    this.aPosition = gl.getAttribLocation(this.program, 'a_position');
    this.aColor = gl.getAttribLocation(this.program, 'a_color');
    this.aSize = gl.getAttribLocation(this.program, 'a_size');
    this.uResolution = gl.getUniformLocation(this.program, 'u_resolution');

    this.positionBuffer = gl.createBuffer();
    this.colorBuffer = gl.createBuffer();
    this.sizeBuffer = gl.createBuffer();

    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

    this.resize(canvas.clientWidth, canvas.clientHeight);
    return this;
  },

  createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      console.warn('Shader compile failed:', gl.getShaderInfoLog(shader));
      gl.deleteShader(shader);
      return null;
    }
    return shader;
  },

  createProgram(gl, vertexSource, fragmentSource) {
    const vertexShader = this.createShader(gl, gl.VERTEX_SHADER, vertexSource);
    const fragmentShader = this.createShader(gl, gl.FRAGMENT_SHADER, fragmentSource);
    if (!vertexShader || !fragmentShader) return null;

    const program = gl.createProgram();
    gl.attachShader(program, vertexShader);
    gl.attachShader(program, fragmentShader);
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      console.warn('Program link failed:', gl.getProgramInfoLog(program));
      gl.deleteProgram(program);
      return null;
    }
    return program;
  },

  vertexShaderSource() {
    return `#version 300 es
    in vec2 a_position;
    in vec4 a_color;
    in float a_size;
    uniform vec2 u_resolution;
    out vec4 v_color;
    void main() {
      vec2 clip = vec2((a_position.x / u_resolution.x) * 2.0 - 1.0,
                       1.0 - (a_position.y / u_resolution.y) * 2.0);
      gl_Position = vec4(clip, 0.0, 1.0);
      gl_PointSize = a_size;
      v_color = a_color;
    }`;
  },

  fragmentShaderSource() {
    return `#version 300 es
    precision mediump float;
    in vec4 v_color;
    out vec4 outColor;
    void main() {
      vec2 coord = gl_PointCoord - vec2(0.5);
      if (length(coord) > 0.5) discard;
      outColor = v_color;
    }`;
  },

  resize(width, height) {
    const gl = this.gl;
    this.canvas.width = width;
    this.canvas.height = height;
    gl.viewport(0, 0, width, height);
  },

  render(particles, pointSize) {
    const gl = this.gl;
    const count = particles.length;
    const positions = new Float32Array(count * 2);
    const colors = new Float32Array(count * 4);
    const sizes = new Float32Array(count);

    for (let i = 0; i < count; i++) {
      const p = particles[i];
      const offset = i * 2;
      positions[offset] = p.position.x;
      positions[offset + 1] = p.position.y;
      const color = Config.teams[p.type].color;
      const cOffset = i * 4;
      colors[cOffset] = color[0] / 255;
      colors[cOffset + 1] = color[1] / 255;
      colors[cOffset + 2] = color[2] / 255;
      colors[cOffset + 3] = 0.92;
      sizes[i] = pointSize * 2.0;
    }

    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.useProgram(this.program);
    gl.uniform2f(this.uResolution, this.canvas.width, this.canvas.height);

    gl.bindBuffer(gl.ARRAY_BUFFER, this.positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, positions, gl.DYNAMIC_DRAW);
    gl.enableVertexAttribArray(this.aPosition);
    gl.vertexAttribPointer(this.aPosition, 2, gl.FLOAT, false, 0, 0);

    gl.bindBuffer(gl.ARRAY_BUFFER, this.colorBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, colors, gl.DYNAMIC_DRAW);
    gl.enableVertexAttribArray(this.aColor);
    gl.vertexAttribPointer(this.aColor, 4, gl.FLOAT, false, 0, 0);

    gl.bindBuffer(gl.ARRAY_BUFFER, this.sizeBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, sizes, gl.DYNAMIC_DRAW);
    gl.enableVertexAttribArray(this.aSize);
    gl.vertexAttribPointer(this.aSize, 1, gl.FLOAT, false, 0, 0);

    gl.drawArrays(gl.POINTS, 0, count);
  }
};

const Simulation = {
  particles: [],
  isPaused: false,
  lastFrameTime: 0,
  fps: 0,
  useGPU: false,
  renderer: null,
  grid: {
    cellSize: 0,
    cols: 0,
    rows: 0,
    cells: []
  },

  settings: {
    interactionRadius: Config.defaultSettings.interactionRadius,
    maxForce: Config.defaultSettings.maxForce,
    maxAccel: Config.defaultSettings.maxAccel,
    friction: Config.defaultSettings.friction,
    maxSpeed: Config.defaultSettings.maxSpeed,
    particleSize: Config.defaultSettings.particleSize,
    counts: Config.defaultSettings.counts.slice(),
    positionMode: Config.defaultSettings.positionMode,
    seed: Config.defaultSettings.seed
  },

  initialize(canvas) {
    this.canvas = canvas;
    this.renderer = GPURenderer.init(canvas);
    this.useGPU = Boolean(this.renderer);
    if (!this.useGPU) {
      this.ctx = canvas.getContext('2d');
    }
    this.resizeCanvas();
    Matrix.initDefaults();
    this.reset();
    window.requestAnimationFrame(this.loop.bind(this));
  },

  resizeCanvas() {
    if (!this.canvas) return;
    this.canvas.width = this.canvas.clientWidth;
    this.canvas.height = this.canvas.clientHeight;
    if (this.useGPU && this.renderer) {
      this.renderer.resize(this.canvas.width, this.canvas.height);
    }
  },

  seedRandom(seed) {
    this._seed = Number(seed) >>> 0;
  },

  random() {
    this._seed = (this._seed * 1664525 + 1013904223) >>> 0;
    return this._seed / 4294967296;
  },

  generateSeed(seed) {
    const sanitized = Number(seed) || 0;
    const result = Math.abs(sanitized % 1000000);
    this.settings.seed = result;
    return result;
  },

  reset() {
    this.particles = [];
    this.isPaused = false;
    this.seedRandom(this.settings.seed);
    this.createParticles();
  },

  createParticles() {
    this.particles = [];
    const { counts, positionMode } = this.settings;
    for (let type = 0; type < Config.teams.length; type++) {
      for (let i = 0; i < counts[type]; i++) {
        const position = this.generatePosition(type, positionMode);
        this.particles.push(new Particle(type, position.x, position.y));
      }
    }
  },

  buildSpatialGrid() {
    const width = this.canvas.width;
    const height = this.canvas.height;
    const cellSize = Math.max(1, this.settings.interactionRadius);
    const cols = Math.max(1, Math.ceil(width / cellSize));
    const rows = Math.max(1, Math.ceil(height / cellSize));
    const cells = new Array(cols * rows);
    for (let i = 0; i < cells.length; i++) {
      cells[i] = [];
    }

    this.grid.cellSize = cellSize;
    this.grid.cols = cols;
    this.grid.rows = rows;
    this.grid.cells = cells;

    for (let index = 0; index < this.particles.length; index++) {
      const particle = this.particles[index];
      const col = Math.floor(particle.position.x / cellSize) % cols;
      const row = Math.floor(particle.position.y / cellSize) % rows;
      const cellIndex = ((col + cols) % cols) + (((row + rows) % rows) * cols);
      cells[cellIndex].push(index);
    }
  },

  generatePosition(type, mode) {
    const w = this.canvas.width;
    const h = this.canvas.height;
    const angle = this.random() * Math.PI * 2;

    if (mode === 'centered') {
      const radius = Math.min(w, h) * 0.12;
      return {
        x: w / 2 + Math.cos(angle) * radius,
        y: h / 2 + Math.sin(angle) * radius
      };
    }

    if (mode === 'circle') {
      const radius = Math.min(w, h) * 0.35;
      return {
        x: w / 2 + Math.cos(angle) * radius,
        y: h / 2 + Math.sin(angle) * radius
      };
    }

    if (mode === 'clusters') {
      const clusterRadius = Math.min(w, h) * 0.15;
      const clusterAngle = (type / Config.teams.length) * Math.PI * 2;
      const clusterCenter = {
        x: w / 2 + Math.cos(clusterAngle) * Math.min(w, h) * 0.25,
        y: h / 2 + Math.sin(clusterAngle) * Math.min(w, h) * 0.25
      };
      const distance = this.random() * clusterRadius;
      return {
        x: clusterCenter.x + Math.cos(angle) * distance,
        y: clusterCenter.y + Math.sin(angle) * distance
      };
    }

    return {
      x: this.random() * w,
      y: this.random() * h
    };
  },

  loop(timestamp) {
    const dt = timestamp - this.lastFrameTime;
    this.lastFrameTime = timestamp;
    if (dt > 0) {
      this.fps = 1000 / dt;
    }

    if (!this.isPaused) {
      this.update();
      this.render();
    }

    UI.updateStats(Math.round(this.fps), this.particles.length, this.settings.seed);
    window.requestAnimationFrame(this.loop.bind(this));
  },

  update() {
    this.buildSpatialGrid();
    const particles = this.particles;
    const radius = this.settings.interactionRadius;
    const radiusSq = radius * radius;
    const maxForce = this.settings.maxForce;
    const maxAccel = this.settings.maxAccel;
    const { cols, rows, cellSize, cells } = this.grid;

    for (let i = 0; i < particles.length; i++) {
      const particle = particles[i];
      particle.resetAcceleration();

      const col = Math.floor(particle.position.x / cellSize) % cols;
      const row = Math.floor(particle.position.y / cellSize) % rows;
      const wrappedCol = (col + cols) % cols;
      const wrappedRow = (row + rows) % rows;

      for (let dy = -1; dy <= 1; dy++) {
        const neighborRow = (wrappedRow + dy + rows) % rows;
        for (let dx = -1; dx <= 1; dx++) {
          const neighborCol = (wrappedCol + dx + cols) % cols;
          const cell = cells[neighborCol + neighborRow * cols];
          for (let k = 0; k < cell.length; k++) {
            const j = cell[k];
            if (i === j) continue;
            const other = particles[j];
            const offset = this.computeToroidalOffset(particle.position, other.position);
            const distSq = offset.x * offset.x + offset.y * offset.y;
            if (distSq === 0 || distSq > radiusSq) continue;

            const distance = Math.sqrt(distSq);
            const relation = Matrix.getValue(particle.type, other.type);
            const forceMagnitude = (1 - distance / radius) * maxForce * relation;
            const invDist = 1 / distance;
            particle.applyForce({
              x: offset.x * invDist * forceMagnitude,
              y: offset.y * invDist * forceMagnitude
            });
          }
        }
      }

      if (particle.type === 4) {
        const wander = Particle.randomVelocity();
        particle.applyForce({ x: wander.x * 0.02, y: wander.y * 0.02 });
      }

      particle.limitAcceleration(maxAccel);
      particle.update(this.settings.maxSpeed, this.settings.friction);
      particle.wrapEdges(this.canvas.width, this.canvas.height);
    }
  },

  render() {
    if (this.useGPU && this.renderer) {
      this.renderer.render(this.particles, this.settings.particleSize);
      return;
    }

    const ctx = this.ctx;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

    for (const particle of this.particles) {
      particle.display(ctx, this.settings.particleSize);
    }
  },

  computeToroidalOffset(source, target) {
    const dx = target.x - source.x;
    const dy = target.y - source.y;
    const width = this.canvas.width;
    const height = this.canvas.height;
    return {
      x: dx > width / 2 ? dx - width : dx < -width / 2 ? dx + width : dx,
      y: dy > height / 2 ? dy - height : dy < -height / 2 ? dy + height : dy
    };
  }
};

const UI = {
  elements: {},

  getTeamClassName(teamName) {
    return teamName
      .toLowerCase()
      .normalize('NFD')
      .replace(/[-]/g, '')
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '');
  },

  getTeamLogoSrc(teamName) {
    const logoMap = {
      'santa fe': 'Santa_Fe.png',
      'bucaramanga': 'Bucaramang.png',
      'nacional': 'Nacional.png',
      'millonarios': 'Millonarios.png',
      'la equidad': 'Equidad.png'
    };
    return logoMap[teamName.toLowerCase()] || '';
  },

  createTeamLabel(teamName) {
    const label = document.createElement('div');
    label.className = `matrix-label matrix-dot team-${this.getTeamClassName(teamName)}`;
    label.title = teamName;

    const logoSrc = this.getTeamLogoSrc(teamName);
    if (logoSrc) {
      const img = document.createElement('img');
      img.src = logoSrc;
      img.alt = teamName;
      label.appendChild(img);
    } else {
      label.textContent = teamName;
    }

    return label;
  },

  init() {
    this.elements = {
      interactionRadius: document.getElementById('interactionRadius'),
      interactionRadiusValue: document.getElementById('interactionRadiusValue'),
      maxForce: document.getElementById('maxForce'),
      maxForceValue: document.getElementById('maxForceValue'),
      maxAccel: document.getElementById('maxAccel'),
      maxAccelValue: document.getElementById('maxAccelValue'),
      friction: document.getElementById('friction'),
      frictionValue: document.getElementById('frictionValue'),
      maxSpeed: document.getElementById('maxSpeed'),
      maxSpeedValue: document.getElementById('maxSpeedValue'),
      particleSize: document.getElementById('particleSize'),
      particleSizeValue: document.getElementById('particleSizeValue'),
      positionMode: document.getElementById('positionMode'),
      countInputs: [
        document.getElementById('count0'),
        document.getElementById('count1'),
        document.getElementById('count2'),
        document.getElementById('count3'),
        document.getElementById('count4')
      ],
      pauseButton: document.getElementById('pauseButton'),
      resumeButton: document.getElementById('resumeButton'),
      resetMatrixButton: document.getElementById('resetMatrixButton'),
      randomizeMatrixButton: document.getElementById('randomizeMatrixButton'),
      fpsValue: document.getElementById('fpsValue'),
      particleCount: document.getElementById('particleCount'),
      matrixTable: document.getElementById('matrixTable')
    };

    Matrix.initDefaults();
    this.bindControls();
    this.buildMatrixUI();
    this.updateControlValues();
  },

  bindControls() {
    const setNumber = (element, setter) => {
      element.addEventListener('input', () => {
        setter(element.value);
        this.updateControlValues();
      });
    };

    setNumber(this.elements.interactionRadius, value => Simulation.settings.interactionRadius = Number(value));
    setNumber(this.elements.maxForce, value => Simulation.settings.maxForce = Number(value));
    setNumber(this.elements.maxAccel, value => Simulation.settings.maxAccel = Number(value));
    setNumber(this.elements.friction, value => Simulation.settings.friction = Number(value));
    setNumber(this.elements.maxSpeed, value => Simulation.settings.maxSpeed = Number(value));
    setNumber(this.elements.particleSize, value => Simulation.settings.particleSize = Number(value));

    this.elements.positionMode.addEventListener('change', () => {
      Simulation.settings.positionMode = this.elements.positionMode.value;
      Simulation.reset();
    });

    this.elements.countInputs.forEach((input, index) => {
      input.addEventListener('change', () => {
        const allowed = this.enforceCountLimit(index, input.value);
        input.value = allowed;
        Simulation.settings.counts[index] = allowed;
        Simulation.reset();
      });
    });

    this.elements.pauseButton.addEventListener('click', () => {
      Simulation.isPaused = true;
    });

    this.elements.resumeButton.addEventListener('click', () => {
      Simulation.isPaused = false;
    });

    this.elements.resetMatrixButton.addEventListener('click', () => {
      Matrix.initDefaults();
      this.updateMatrixUI();
    });

    this.elements.randomizeMatrixButton.addEventListener('click', () => {
      Matrix.randomize();
      this.updateMatrixUI();
    });
  },

  buildMatrixUI() {
    const headerRow = document.createElement('div');
    headerRow.className = 'matrix-row header';
    headerRow.appendChild(document.createElement('div'));

    Config.teams.forEach(team => {
      headerRow.appendChild(this.createTeamLabel(team.name));
    });

    this.elements.matrixTable.appendChild(headerRow);

    Matrix.values.forEach((row, rowIndex) => {
      const rowElement = document.createElement('div');
      rowElement.className = 'matrix-row';
      rowElement.appendChild(this.createTeamLabel(Config.teams[rowIndex].name));

      row.forEach((value, colIndex) => {
        const cell = document.createElement('div');
        cell.className = 'matrix-cell';

        const slider = document.createElement('input');
        slider.type = 'range';
        slider.min = -1;
        slider.max = 1;
        slider.step = 0.02;
        slider.value = value;
        slider.dataset.row = rowIndex;
        slider.dataset.col = colIndex;
        slider.title = `${Config.teams[rowIndex].name} → ${Config.teams[colIndex].name}: ${value.toFixed(2)}`;

        const valueLabel = document.createElement('div');
        valueLabel.className = 'matrix-value';
        valueLabel.textContent = value.toFixed(2);

        slider.addEventListener('input', () => {
          const r = Number(slider.dataset.row);
          const c = Number(slider.dataset.col);
          const val = Number(slider.value);
          Matrix.setValue(r, c, val);
          valueLabel.textContent = val.toFixed(2);
          this.updateMatrixCellColor(cell, val);
          slider.title = `${Config.teams[r].name} → ${Config.teams[c].name}: ${val.toFixed(2)}`;
        });

        this.updateMatrixCellColor(cell, value);
        cell.appendChild(slider);
        cell.appendChild(valueLabel);
        rowElement.appendChild(cell);
      });

      this.elements.matrixTable.appendChild(rowElement);
    });
  },

  updateMatrixUI() {
    const sliders = this.elements.matrixTable.querySelectorAll('input[type="range"]');
    sliders.forEach(slider => {
      const row = Number(slider.dataset.row);
      const col = Number(slider.dataset.col);
      const value = Matrix.getValue(row, col);
      slider.value = value;
      const cell = slider.closest('.matrix-cell');
      const label = cell.querySelector('.matrix-value');
      if (label) label.textContent = value.toFixed(2);
      this.updateMatrixCellColor(cell, value);
      slider.title = `${Config.teams[row].name} → ${Config.teams[col].name}: ${value.toFixed(2)}`;
    });
  },

  updateControlValues() {
    this.elements.interactionRadiusValue.textContent = Simulation.settings.interactionRadius;
    this.elements.maxForceValue.textContent = Simulation.settings.maxForce.toFixed(2);
    this.elements.maxAccelValue.textContent = Simulation.settings.maxAccel.toFixed(2);
    this.elements.frictionValue.textContent = Simulation.settings.friction.toFixed(2);
    this.elements.maxSpeedValue.textContent = Simulation.settings.maxSpeed.toFixed(1);
    this.elements.particleSizeValue.textContent = Simulation.settings.particleSize;
    this.elements.countInputs.forEach((input, index) => {
      input.value = Simulation.settings.counts[index];
    });
    this.elements.positionMode.value = Simulation.settings.positionMode;
  },

  enforceCountLimit(changedIndex, requestedValue) {
    const values = Simulation.settings.counts.slice();
    values[changedIndex] = Number(requestedValue);
    const total = values.reduce((sum, n) => sum + n, 0);
    if (total <= 2000) {
      return Number(requestedValue);
    }

    const excess = total - 2000;
    let newValue = Number(requestedValue) - excess;
    if (newValue < 5) newValue = 5;
    return newValue;
  },


  updateStats(fps, totalParticles) {
    this.elements.fpsValue.textContent = fps;
    this.elements.particleCount.textContent = totalParticles;
  },

  updateMatrixCellColor(cell, value) {
    const intensity = Math.min(1, Math.abs(value));
    const positive = value > 0;
    const negative = value < 0;
    const base = positive ? [48, 210, 45] : negative ? [220, 35, 35] : [30, 30, 30];
    const alpha = 0.18 + intensity * 0.6;
    const brightness = 0.08 + intensity * 0.35;
    const background = negative || positive
      ? `rgba(${base[0]}, ${base[1]}, ${base[2]}, ${alpha})`
      : `rgba(18, 18, 18, 0.95)`;

    cell.style.background = background;
    cell.style.boxShadow = negative || positive
      ? `inset 0 0 0 1px rgba(255,255,255, ${0.06 + brightness * 0.1})`
      : 'inset 0 0 0 1px rgba(255,255,255, 0.06)';
  }
};

document.addEventListener('DOMContentLoaded', () => {
  const canvas = document.getElementById('simCanvas');
  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;

  UI.init();
  Simulation.initialize(canvas);

  window.addEventListener('resize', () => {
    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;
    Simulation.resizeCanvas();
    Simulation.reset();
  });
});
  </script>
</body>
</html>
