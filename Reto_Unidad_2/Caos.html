<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Caos vs Orden - Particle Life</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.7.0/lib/p5.min.js"></script>
</head>
<body>
  <script>
    // =====================
    // Parámetros editables
    // =====================
    const PARTICLES_NACIONAL = 40;
    const PARTICLES_MEDELLIN = 30;
    const PARTICLES_BUCARAMANGA = 20;
    const PARTICLES_MILLONARIOS = 25;
    const PARTICLES_ENVIGADO = 25;
    const INTERACTION_RADIUS = 130;
    const MAX_FORCE = 0.18;
    const FRICTION = 0.94;
    const MAX_SPEED = 4.0;
    const PARTICLE_SIZE = 6;

    // Matriz de relaciones (editable)
    // Filas: emisor / Columnas: receptor
    const relationMatrix = [
      [ 0.8, -1.0,  0.5,  0.3,  0.2], // Nacional
      [-1.0, -0.3, -0.4, -0.6, -0.5], // Medellín
      [ 0.0,  0.4,  0.6,  0.2,  0.5], // Bucaramanga
      [ 0.5, -0.5,  0.3,  0.7,  0.0], // Millonarios
      [-0.2,  0.4, -0.1,  0.5, -0.3]  // Envigado
    ];

    const teams = [
      { name: 'Nacional', color: [30, 220, 80], count: PARTICLES_NACIONAL },
      { name: 'Medellín', color: [255, 60, 60], count: PARTICLES_MEDELLIN },
      { name: 'Bucaramanga', color: [255, 225, 65], count: PARTICLES_BUCARAMANGA },
      { name: 'Millonarios', color: [80, 145, 255], count: PARTICLES_MILLONARIOS },
      { name: 'Envigado', color: [255, 145, 60], count: PARTICLES_ENVIGADO }
    ];

    let particles = [];
    let seedValue;

    function setup() {
      createCanvas(windowWidth, windowHeight);
      background(0);
      seedValue = Math.floor(Date.now() % 1000000);
      randomSeed(seedValue);
      noiseSeed(seedValue);
      createParticles();
    }

    function draw() {
      background(0, 24);
      applyInteractions();
      for (const particle of particles) {
        particle.update();
        particle.display();
      }
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
    }

    // Crea todas las partículas según cada equipo.
    function createParticles() {
      particles = [];
      let teamIndex = 0;
      for (const team of teams) {
        for (let i = 0; i < team.count; i++) {
          particles.push(new Particle(teamIndex, team.color));
        }
        teamIndex++;
      }
    }

    // Aplica las fuerzas de interacción entre todas las partículas.
    function applyInteractions() {
      const total = particles.length;
      for (let i = 0; i < total; i++) {
        const particleA = particles[i];
        particleA.resetAcceleration();
        for (let j = 0; j < total; j++) {
          if (i === j) continue;
          const particleB = particles[j];
          const force = particleA.interactionForce(particleB);
          particleA.applyForce(force);
        }
      }
    }

    class Particle {
      constructor(teamIndex, color) {
        this.teamIndex = teamIndex;
        this.color = color;
        this.position = createVector(random(width), random(height));
        this.velocity = p5.Vector.random2D().mult(random(1, MAX_SPEED));
        this.acceleration = createVector(0, 0);
      }

      resetAcceleration() {
        this.acceleration.mult(0);
      }

      applyForce(force) {
        this.acceleration.add(force);
      }

      // Calcula la fuerza ejercida por otra partícula usando la matriz de relaciones.
      interactionForce(other) {
        const offset = p5.Vector.sub(other.position, this.position);
        this.applyToroidalOffset(offset);
        const distance = constrain(offset.mag(), 1, INTERACTION_RADIUS);
        const relation = relationMatrix[this.teamIndex][other.teamIndex];
        const strength = map(distance, 0, INTERACTION_RADIUS, MAX_FORCE, 0);
        const force = offset.copy().setMag(strength * relation);

        // Envigado introduce un comportamiento explorador adicional.
        if (this.teamIndex === 4) {
          const jitter = p5.Vector.random2D().mult(0.02);
          force.add(jitter);
        }

        return force;
      }

      // Ajusta el vector a la distancia mínima en un espacio toroidal.
      applyToroidalOffset(offset) {
        if (abs(offset.x) > width / 2) {
          offset.x += offset.x > 0 ? -width : width;
        }
        if (abs(offset.y) > height / 2) {
          offset.y += offset.y > 0 ? -height : height;
        }
      }

      update() {
        // Refuerza la exploración de Envigado con cambios de dirección leves.
        if (this.teamIndex === 4) {
          const wander = p5.Vector.random2D().mult(0.05);
          this.acceleration.add(wander);
        }

        this.velocity.add(this.acceleration);
        this.velocity.limit(MAX_SPEED);
        this.velocity.mult(FRICTION);
        this.position.add(this.velocity);
        this.wrapEdges();
      }

      wrapEdges() {
        if (this.position.x < 0) this.position.x += width;
        if (this.position.x > width) this.position.x -= width;
        if (this.position.y < 0) this.position.y += height;
        if (this.position.y > height) this.position.y -= height;
      }

      display() {
        noStroke();
        const alpha = 180;
        fill(this.color[0], this.color[1], this.color[2], alpha);
        circle(this.position.x, this.position.y, PARTICLE_SIZE);
      }
    }
  </script>
</body>
</html>
