<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA · Gremio de Aventureros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<!-- respaldo: si la red bloquea cdnjs, Matter.js se trae de jsdelivr -->
<script>window.Matter || document.write('<script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"><\/script>')</script>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#121a29; }
  canvas { display:block; width:100vw; height:100vh; touch-action:none; cursor:grab; }
  canvas:active { cursor:grabbing; }
  #pista { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); color:#8d97ab;
    font:500 14px Cinzel, serif; letter-spacing:.18em; transition:opacity 1.2s; pointer-events:none; white-space:nowrap; }
  #panel { position:fixed; left:12px; top:12px; color:#cfd6e3; background:rgba(8,12,20,.8); font:12px/1.5 system-ui, sans-serif;
    padding:10px 12px; border-radius:6px; display:none; min-width:220px; }
  #panel.on { display:block; }
  #panel b { color:#d4af37; font-weight:500; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="pista">la brújula de la O señala a quién buscar · arrástrala hasta su lado</div>
<div id="panel"></div>
<script>
// si algo falla al cargar, decirlo en pantalla en vez de dejarla vacía
function avisar(msg) {
  const d = document.getElementById('pista');
  d.style.cssText += ';color:#d4af37;opacity:1;white-space:normal;text-align:center;letter-spacing:.05em';
  d.textContent = msg;
}
addEventListener('error', e => avisar('no se pudo cargar: ' + (e.message || 'error') + ' · recarga con Ctrl+F5'));
if (!window.Matter) avisar('no se pudo cargar la librería de física (Matter.js): revisa la conexión y recarga');
(async () => {
'use strict';
if (!window.Matter) return;
const { Engine, Bodies, Body, Composite, Constraint, Mouse, MouseConstraint, Events, Vector } = Matter;
const TAU = Math.PI * 2;
const PLATA = '#cfd6e3', PLATA_OSC = '#5d6779', ORO = '#d4af37';
const FUENTE = 'Cinzel, "Trajan Pro", Georgia, serif';
const FUENTE_DECO = '"Cinzel Decorative", Cinzel, Georgia, serif'; // N, V y A: con los remates curvos del logo

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const pista = document.getElementById('pista'), panel = document.getElementById('panel');
// Espera la fuente como máximo 2.5 s: si Google Fonts tarda, arranca con la de respaldo
// y, cuando llega Cinzel, vuelve a armar las letras con sus medidas reales.
const fuenteLista = Promise.all([document.fonts.load(`700 100px Cinzel`), document.fonts.load(`500 20px Cinzel`), document.fonts.load(`700 100px "Cinzel Decorative"`)]).catch(() => null);
const aTiempo = await Promise.race([fuenteLista.then(() => true), new Promise(r => setTimeout(() => r(false), 2500))]);
if (!aTiempo) fuenteLista.then(() => { if (document.fonts.check('700 40px Cinzel')) { medir(); construirParedes(); crearLetras(); crearGremio(); } });

// ---------- reglas (los números que se pueden cambiar para verificar predicciones) ----------
const R = {
  tiempoVinculo: 0.25,  // s que dos letras deben estar al alcance para tomarse de la mano
  alcanceMano: 0.15,    // × tamaño de letra: distancia entre sus cajas a la que se alcanzan
  alcanceAyuda: 0.6,    // × tamaño de letra: a esta distancia de la letra que llevas, una letra tirada se levanta
  levantar: 0.02,       // fuerza con la que se pone de pie la letra que levantas o la que se levanta a recibirla
  rupturaVinculo: 0.65, // × tamaño de letra: si el vínculo se estira más, se rompe
  rigidezVinculo: 0.25,
  inclinacionMano: 0.8, // rad: más inclinada que esto, una letra no puede tomarse de la mano
  enderezar: 0.003,     // fuerza con la que un grupo ayuda a sus miembros a ponerse de pie (× tamaño del grupo)
  sueno: 2.5,           // s sola y quieta para dormirse (apagarse)
  tiempoRechazo: 0.3,   // s que una letra equivocada debe estar junto al grupo de la O para ser rechazada
  empujeRechazo: 0.012, // fuerza (× masa) con la que el grupo la aparta
  llegarLogo: 0.07,     // qué tan rápido se acomodan en el centro al completarse (fracción por paso)
  percepcionGremio: 160,// px base con los que una letra pequeña percibe un grupo (+ 90 por miembro)
};
// Las únicas uniones posibles, con su lado: [izquierda, derecha]. Todas salen de la O:
// la A solo puede llegar cuando la V ya está con la O.
const PARES = [['N', 'O'], ['O', 'V'], ['V', 'A']];

let W, H, DPR, F, capH;
const engine = Engine.create({ gravity: { y: 1 } });
const world = engine.world;
let paredes = [];
let letras = [];       // N O V A
let vinculos = [];     // { a, b, c }
const contacto = new Map();
let t = 0, lectura = false, lecturaT = 0, logoT0 = 0, brujula = -Math.PI / 2, primerVinculo = false, buscada = null;

// ---------- escena ----------
function medir() {
  // tamaño mínimo: una pestaña abierta en segundo plano puede reportar 0 y las letras nacerían de tamaño 0
  W = Math.max(innerWidth, 320); H = Math.max(innerHeight, 320); DPR = Math.min(devicePixelRatio || 1, 2);
  cv.width = W * DPR; cv.height = H * DPR;
  // Matter convierte la posición del mouse con (ancho del canvas / ancho en pantalla) / pixelRatio:
  // sin decirle el DPR, en pantallas 2× el mouse quedaba al doble de distancia y no agarraba las letras
  cv.setAttribute('data-pixel-ratio', DPR);
  if (typeof mouse !== 'undefined') mouse.pixelRatio = DPR;
  F = Math.min(W * 0.15, H * 0.3);
  ctx.font = `700 ${F}px ${FUENTE}`;
  capH = ctx.measureText('N').actualBoundingBoxAscent || F * 0.7;
}
function construirParedes() {
  Composite.remove(world, paredes);
  const g = 200;
  paredes = [
    Bodies.rectangle(W / 2, H + g / 2 - 10, W * 3, g, { isStatic: true }),           // suelo (10 px de margen para las serifas)
    Bodies.rectangle(-g / 2, H / 2, g, H * 4, { isStatic: true }),                    // izquierda
    Bodies.rectangle(W + g / 2, H / 2, g, H * 4, { isStatic: true }),                 // derecha
    Bodies.rectangle(W / 2, -H * 1.5 - g / 2, W * 3, g, { isStatic: true }),          // techo lejano
  ];
  Composite.add(world, paredes);
}

// Cada letra es un cuerpo hecho de sus trazos (cuerpo compuesto): la V son dos barras inclinadas,
// la A dos barras y el travesaño, la N dos palos y la diagonal. Así chocan como la letra que se ve
// y pueden encajar entre sí (la A dentro de la abertura de la V), en vez de ser bloques sólidos.
function trazo(x1, y1, x2, y2, g, op) {
  return Bodies.rectangle((x1 + x2) / 2, (y1 + y2) / 2, Math.hypot(x2 - x1, y2 - y1) + g * 0.4, g,
    { ...op, angle: Math.atan2(y2 - y1, x2 - x1) });
}
function crearLetra(ch, x, y) {
  ctx.font = `700 ${F}px ${ch === 'O' ? FUENTE : FUENTE_DECO}`;
  const w = ctx.measureText(ch).width * 0.9, h = capH, g = h * 0.15; // g: grosor del trazo
  const op = { friction: 0.6, frictionAir: 0.012, restitution: 0.1, density: 0.0016 };
  const L = x - w / 2 + g / 2, Rr = x + w / 2 - g / 2, T = y - h / 2 + g / 2, B = y + h / 2 - g / 2;
  let partes;
  if (ch === 'O') partes = [Bodies.circle(x, y, (w + h) / 4, op)];
  else if (ch === 'N') partes = [trazo(L, T, L, B, g, op), trazo(Rr, T, Rr, B, g, op), trazo(L, T, Rr, B, g, op)];
  else if (ch === 'V') partes = [trazo(L, T, x, B, g, op), trazo(Rr, T, x, B, g, op)];
  else if (ch === 'A') partes = [trazo(x, T, L, B, g, op), trazo(x, T, Rr, B, g, op), trazo(x - w * 0.24, y + h * 0.15, x + w * 0.24, y + h * 0.15, g * 0.8, op)];
  const b = partes.length === 1 ? partes[0] : Body.create({ parts: partes, ...op });
  // el cuerpo queda centrado en su centro de masa; guardamos dónde quedó el centro del glifo
  b.off = { x: x - b.position.x, y: y - b.position.y };
  b.ch = ch; b.quieta = 0; b.dormida = 0; b.oro = 0; b.rechazo = 0;
  Composite.add(world, b);
  return b;
}
function crearLetras() {
  letras.forEach(l => Composite.remove(world, l));
  vinculos.forEach(v => Composite.remove(world, v.c));
  letras = []; vinculos = []; contacto.clear(); lectura = false; resetIconos();
  mc.collisionFilter.mask = 0xFFFFFFFF; // se pueden volver a agarrar
  // caen dispersas y desordenadas: nadie empieza en grupo
  const orden = ['V', 'N', 'A', 'O'];
  orden.forEach((ch, i) => {
    const l = crearLetra(ch, W * (0.18 + i * 0.21) + (Math.random() - 0.5) * 40, -F * (0.6 + i * 0.5));
    Body.setAngle(l, (Math.random() - 0.5) * 1.2);
    letras.push(l);
  });
}

// ---------- el gremio: letras pequeñas que caminan (steering) ----------
const SUB = 'GREMIO DE AVENTUREROS';
let gremio = [];
// ---------- íconos de lo que se hace en NOVA: cada unión desbloquea uno ----------
// N+O → cartas (TCG) · O+V → dado (juegos de mesa) · V+A → d20 (rol) · NOVA completo → trofeo (torneos)
// Están armados solo con letras: los trazos son letras I estiradas, los puntos son O pequeñas
// y el trofeo es una U (copa) con dos C (asas), una I (pie) y una I acostada (base).
const ICONOS = [
  { id: 'cartas', par: ['N', 'O'] }, { id: 'dado', par: ['O', 'V'] },
  { id: 'd20', par: ['V', 'A'] }, { id: 'trofeo', par: null },
].map((c, i) => ({ ...c, x: 0, y: 0, alfa: 0, esc: 0, fase: i * 1.7, visto: false }));
function resetIconos() { ICONOS.forEach(c => { c.alfa = 0; c.esc = 0; c.visto = false; }); }
function pasoIconos() {
  const L = ch => letras.find(l => l.ch === ch);
  const S = F * 0.42;
  const activos = ICONOS.filter(c => lectura || (c.par && unidas(L(c.par[0]), L(c.par[1]))));
  // dónde flotan: en juego, en fila sobre el grupo de la O; en el logo, dos a cada lado de la palabra
  const o = L('O'), g = o.grupo || [o];
  const cx = g.reduce((s, l) => s + l.position.x, 0) / g.length;
  const arriba = Math.min(...g.map(l => l.bounds.min.y));
  const xs = letras.map(l => l.position.x), izq = Math.min(...xs) - F * 0.9, der = Math.max(...xs) + F * 0.9;
  activos.forEach((c, k) => {
    let tx, ty;
    if (lectura) { tx = k < 2 ? izq : der; ty = H * 0.42 + (k % 2 ? S * 0.7 : -S * 0.7); }
    else { tx = cx + (k - (activos.length - 1) / 2) * S * 1.5; ty = Math.max(S, arriba - S * 0.9); }
    if (!c.visto) { c.x = cx; c.y = arriba; c.visto = true; }    // nace desde el grupo
    c.x += (tx - c.x) * 0.06; c.y += (ty - c.y) * 0.06;
  });
  for (const c of ICONOS) {
    const on = activos.includes(c);
    c.alfa += ((on ? 1 : 0) - c.alfa) * (on ? 0.06 : 0.12);
    c.esc += ((on ? 1 : 0.6) - c.esc) * 0.12;
    if (!on && c.alfa < 0.02) c.visto = false;
  }
}
// una letra I estirada entre dos puntos (el trazo de todos los íconos)
function palo(x1, y1, x2, y2, grosor) {
  const len = Math.hypot(x2 - x1, y2 - y1);
  ctx.save();
  ctx.translate((x1 + x2) / 2, (y1 + y2) / 2); ctx.rotate(Math.atan2(y2 - y1, x2 - x1) + Math.PI / 2);
  ctx.scale(grosor, len / capH);
  ctx.fillText('I', 0, capH / 2); // centrada en la altura de mayúscula, no en la caja de la fuente
  ctx.restore();
}
function letraIcono(ch, x, y, alto, ancho, rot = 0, espejo = 1) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(ancho / capH * espejo, alto / capH);
  ctx.fillText(ch, 0, capH / 2); ctx.restore();
}
function marco(x, y, w, h, rot, gr) { // rectángulo de 4 letras I
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  palo(-w / 2, -h / 2, -w / 2, h / 2, gr); palo(w / 2, -h / 2, w / 2, h / 2, gr);
  palo(-w / 2, -h / 2, w / 2, -h / 2, gr); palo(-w / 2, h / 2, w / 2, h / 2, gr);
  ctx.restore();
}
function dibujarIconos() {
  const S = F * 0.42, gr = 0.24; // gr: qué tan gruesa es la I (más gruesa, más se notan sus serifas)
  ctx.font = `500 ${F}px ${FUENTE}`; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  for (const c of ICONOS) {
    if (c.alfa < 0.02) continue;
    ctx.save();
    ctx.globalAlpha = c.alfa;
    ctx.translate(c.x, c.y + Math.sin(t * 1.6 + c.fase) * S * 0.08);   // flotan
    ctx.rotate(Math.sin(t * 1.1 + c.fase) * 0.06);
    ctx.scale(c.esc, c.esc);
    ctx.fillStyle = '#d9b65e'; ctx.shadowColor = ORO; ctx.shadowBlur = 12;
    if (c.id === 'cartas') {
      // tres cartas en abanico; cada una tapa a la de atrás con el color del fondo
      for (const [dx, rot] of [[-S * 0.18, -0.32], [0, -0.08], [S * 0.18, 0.18]]) {
        ctx.save(); ctx.translate(dx, 0); ctx.rotate(rot);
        ctx.shadowBlur = 0; ctx.fillStyle = '#141c2e'; ctx.fillRect(-S * 0.24, -S * 0.36, S * 0.48, S * 0.72);
        ctx.fillStyle = '#d9b65e'; ctx.shadowBlur = 12;
        marco(0, 0, S * 0.48, S * 0.72, 0, gr); ctx.restore();
      }
    } else if (c.id === 'dado') {
      marco(0, 0, S * 0.7, S * 0.7, 0, gr);
      for (const [px, py] of [[-.18, -.18], [0, 0], [.18, .18], [.18, -.18], [-.18, .18]])
        letraIcono('O', px * S, py * S, S * 0.12, S * 0.12);
    } else if (c.id === 'd20') {
      const r = S * 0.42, hx = k => Math.cos(-Math.PI / 2 + k * Math.PI / 3) * r, hy = k => Math.sin(-Math.PI / 2 + k * Math.PI / 3) * r;
      const ri = r * 0.52, ix = k => Math.cos(-Math.PI / 2 + k * TAU / 3) * ri, iy = k => Math.sin(-Math.PI / 2 + k * TAU / 3) * ri;
      for (let k = 0; k < 6; k++) palo(hx(k), hy(k), hx(k + 1), hy(k + 1), gr);           // hexágono
      for (let k = 0; k < 3; k++) palo(ix(k), iy(k), ix(k + 1), iy(k + 1), gr);           // triángulo
      for (let k = 0; k < 3; k++) for (const d of [-1, 0, 1]) {                            // aristas hacia afuera
        const hk = (2 * k + d + 6) % 6; palo(ix(k), iy(k), hx(hk), hy(hk), gr * 0.6);
      }
    } else if (c.id === 'trofeo') {
      // dibujo de línea como los demás íconos: todo son trazos de I
      // arco(cx, cy, rx, ry, desde, hasta, n): una curva hecha de n letras I
      const arco = (cx, cy, rx, ry, a0, a1, n) => {
        for (let k = 0; k < n; k++) {
          const p = a0 + (a1 - a0) * k / n, q = a0 + (a1 - a0) * (k + 1) / n;
          palo(cx + Math.cos(p) * rx, cy + Math.sin(p) * ry, cx + Math.cos(q) * rx, cy + Math.sin(q) * ry, gr);
        }
      };
      const borde = -S * 0.36, rx = S * 0.24;
      palo(-rx, borde, rx, borde, gr);                                   // borde de la copa
      arco(0, borde, rx, S * 0.34, 0, Math.PI, 6);                       // cuerpo de la copa (media elipse)
      arco(-rx, borde + S * 0.11, S * 0.1, S * 0.09, Math.PI / 2, Math.PI * 1.5, 3);   // asa izquierda
      arco(rx, borde + S * 0.11, S * 0.1, S * 0.09, -Math.PI / 2, Math.PI / 2, 3);     // asa derecha
      palo(0, -S * 0.02, 0, S * 0.2, gr);                                // pie
      marco(0, S * 0.27, S * 0.34, S * 0.12, 0, gr);                     // base
    }
    ctx.restore();
  }
}

function crearGremio() {
  gremio = [];
  let k = 0;
  for (let i = 0; i < SUB.length; i++) {
    if (SUB[i] === ' ') continue;
    gremio.push({ ch: SUB[i], idx: i, x: Math.random() * W, y: H - 30 - Math.random() * 20, vx: (Math.random() - .5) * 2, vy: 0,
      a: Math.random() * TAU, ang: 0, k: k++ });
  }
}

// ---------- grupos (componentes conexas de los vínculos) ----------
function grupos() {
  const p = new Map(letras.map(l => [l, l]));
  const raiz = l => { while (p.get(l) !== l) l = p.get(l); return l; };
  vinculos.forEach(v => p.set(raiz(v.a), raiz(v.b)));
  const g = new Map();
  letras.forEach(l => { const r = raiz(l); if (!g.has(r)) g.set(r, []); g.get(r).push(l); });
  letras.forEach(l => l.grupo = g.get(raiz(l)));
  return [...g.values()];
}
const centro = (g) => { let x = 0, y = 0; g.forEach(l => { x += l.position.x; y += l.position.y; }); return { x: x / g.length, y: y / g.length }; };
const unidas = (a, b) => vinculos.some(v => (v.a === a && v.b === b) || (v.a === b && v.b === a));
const angNorm = a => { a %= TAU; if (a > Math.PI) a -= TAU; if (a < -Math.PI) a += TAU; return a; };
// distancia entre las cajas de dos letras (0 si se tocan o se montan)
function distCajas(a, b) {
  const A = a.bounds, B = b.bounds;
  return Math.hypot(Math.max(A.min.x - B.max.x, B.min.x - A.max.x, 0), Math.max(A.min.y - B.max.y, B.min.y - A.max.y, 0));
}
function soltar(l) {
  vinculos = vinculos.filter(v => { if (v.a === l || v.b === l) { Composite.remove(world, v.c); return false; } return true; });
}

// ---------- vínculos: estar al alcance de la mano un momento = tomarse de la mano ----------
// Se usa la distancia entre las cajas de las letras, no el choque exacto: una V, una A y una O
// puestas en fila casi no se tocan (V ancha arriba, A ancha abajo, O redonda) y nunca se unirían.
const clave = (a, b) => a.id + ':' + b.id;
const letraO = () => letras.find(l => l.ch === 'O');
// ¿esta unión es una de las permitidas, del lado correcto y conectada con la O?
function unionValida(a, b) {
  const p = PARES.find(p => (p[0] === a.ch && p[1] === b.ch) || (p[0] === b.ch && p[1] === a.ch));
  if (!p) return false;
  const izq = a.ch === p[0] ? a : b, der = izq === a ? b : a;
  const grupoO = letraO().grupo || [];
  return izq.position.x < der.position.x && (grupoO.includes(izq) || grupoO.includes(der));
}
function buscarVinculos() {
  const alcance = F * R.alcanceMano;
  const grupoO = letraO().grupo || [];
  const sostenida = mc.body && letras.includes(mc.body) ? mc.body : null;
  for (let i = 0; i < letras.length; i++) for (let j = i + 1; j < letras.length; j++) {
    const a = letras[i], b = letras[j], k = clave(a, b);
    if (unidas(a, b)) { contacto.delete(k); continue; }
    // de la mano = lado a lado: cerca, a la misma altura y las dos más o menos derechas (no apiladas ni de cabeza)
    const derecha = l => Math.abs(angNorm(l.angle)) < R.inclinacionMano;
    const ladoALado = Math.abs(a.position.y - b.position.y) < F * 0.6 && derecha(a) && derecha(b);
    if (distCajas(a, b) > alcance || !ladoALado) { contacto.delete(k); continue; }
    const tc = (contacto.get(k) || 0) + 1 / 60;
    contacto.set(k, tc);
    if (!unionValida(a, b)) {
      // la llevas al grupo de la O pero no le toca (o va del lado equivocado): tiembla y la apartan
      const dentro = grupoO.includes(a) ? a : grupoO.includes(b) ? b : null, fuera = dentro === a ? b : a;
      if (dentro && !grupoO.includes(fuera) && tc >= R.tiempoRechazo) {
        fuera.rechazo = 1;
        const lado = Math.sign(fuera.position.x - dentro.position.x) || 1;
        Body.applyForce(fuera, fuera.position, { x: lado * R.empujeRechazo * fuera.mass, y: -R.empujeRechazo * 0.5 * fuera.mass });
        if (fuera === sostenida) soltarMouse(0.5); // se te suelta de la mano
        contacto.delete(k);
      }
      continue;
    }
    if (tc < R.tiempoVinculo) continue;
    // la "mano": un punto entre las dos que ambas sostienen
    const m = Vector.mult(Vector.add(a.position, b.position), 0.5);
    const c = Constraint.create({ bodyA: a, bodyB: b, pointA: Vector.sub(m, a.position), pointB: Vector.sub(m, b.position),
      length: 0, stiffness: R.rigidezVinculo, damping: 0.1 });
    Composite.add(world, c);
    vinculos.push({ a, b, c });
    contacto.delete(k);
    a.chispa = b.chispa = 1;
    if (!primerVinculo) { primerVinculo = true; pista.style.opacity = 0; }
  }
}

// ---------- mouse ----------
const mouse = Mouse.create(cv);
const mc = MouseConstraint.create(engine, { mouse, constraint: { stiffness: 0.18, damping: 0.1, render: { visible: false } } });
Composite.add(world, mc);
mouse.element.removeEventListener('mousewheel', mouse.mousewheel);
mouse.element.removeEventListener('DOMMouseScroll', mouse.mousewheel);
mouse.element.removeEventListener('wheel', mouse.mousewheel);
// suelta lo que el mouse tenga agarrado y no deja agarrar nada durante `s` segundos
// (Matter vuelve a agarrar lo que esté bajo el cursor mientras el botón siga presionado)
let bloqueoMouse = 0;
function soltarMouse(s) {
  mc.body = null; mc.constraint.bodyB = null; mc.constraint.pointB = null;
  mc.collisionFilter.mask = 0; bloqueoMouse = s;
}
cv.addEventListener('dblclick', e => {
  const p = { x: e.clientX, y: e.clientY };
  const l = letras.find(l => Matter.Vertices.contains(l.vertices, p) || (l.ch === 'O' && Vector.magnitude(Vector.sub(l.position, p)) < l.circleRadius));
  if (l && !lectura) { soltar(l); Body.applyForce(l, l.position, { x: 0, y: -0.02 * l.mass }); }
});

// ---------- reglas que corren cada paso ----------
function paso() {
  t += 1 / 60;
  if (bloqueoMouse > 0 && (bloqueoMouse -= 1 / 60) <= 0 && !lectura) mc.collisionFilter.mask = 0xFFFFFFFF;
  if (lectura) { pasoLogo(); return; }
  buscarVinculos();
  // vínculos que se estiran demasiado se rompen
  vinculos = vinculos.filter(v => {
    const pa = Vector.add(v.a.position, v.c.pointA), pb = Vector.add(v.b.position, v.c.pointB);
    if (Vector.magnitude(Vector.sub(pa, pb)) > F * R.rupturaVinculo) { Composite.remove(world, v.c); return false; }
    return true;
  });
  const gs = grupos();
  const sostenida = mc.body && letras.includes(mc.body) ? mc.body : null;
  const grupoSost = sostenida ? sostenida.grupo : [];
  for (const l of letras) {
    const n = l.grupo.length;
    let k = 0, kd = 0.15;
    // en grupo se ayudan a estar de pie; sola no hay quien la sostenga
    // (no mientras arrastras el grupo: así se puede girar y voltear)
    if (n > 1 && !grupoSost.includes(l)) k = R.enderezar * n;
    // si levantas una letra sola, se pone de pie (como alguien a quien ayudas a pararse)
    if (l === sostenida && n === 1) { k = R.levantar; kd = 0.25; }
    // acompañada se levanta: si le acercas una letra, la que estaba tirada se para para tomarle la mano
    if (sostenida && !grupoSost.includes(l) && grupoSost.some(m => distCajas(l, m) < F * R.alcanceAyuda)) {
      k = Math.max(k, R.levantar); kd = 0.25; l.quieta = 0;
    }
    if (k) {
      // aceleración angular deseada (rad/paso²): resorte hacia la vertical + amortiguación.
      // Matter aplica torque · (1/inercia) · dt², por eso se divide entre dt² (16.7 ms)² ≈ 278
      const alfa = -angNorm(l.angle) * k - l.angularVelocity * kd;
      l.torque += alfa * l.inertia / 277.8;
    }
    // sueño: sola y quieta → se apaga
    const quieta = l.speed < 0.3 && Math.abs(l.angularVelocity) < 0.02;
    l.quieta = (n === 1 && quieta && mc.body !== l) ? l.quieta + 1 / 60 : 0;
    l.dormida += ((l.quieta > R.sueno ? 1 : 0) - l.dormida) * 0.04;
    l.oro += ((n > 1 ? (n - 1) / 3 : 0) - l.oro) * 0.08;
    l.chispa = (l.chispa || 0) * 0.93;
    l.rechazo *= 0.9;
  }
  // completo: como solo existen las uniones correctas, si las cuatro están juntas se lee NOVA
  if (letraO().grupo.length === 4) empezarLogo();
  pasoBrujula(gs);
  pasoIconos();
  pasoGremio(gs);
}

// La brújula (la O) apunta a la letra que le toca unirse: N, luego V, luego A
// (la A solo cuando ya está la V). Esa letra brilla un poco para que se note.
function siguiente() {
  const g = letraO().grupo;
  for (const ch of ['N', 'V', 'A']) {
    const l = letras.find(x => x.ch === ch);
    if (g.includes(l)) continue;
    if (ch === 'A' && !g.some(x => x.ch === 'V')) continue;
    return l;
  }
  return null;
}
function pasoBrujula() {
  const o = letraO();
  buscada = siguiente();
  const obj = buscada ? Math.atan2(buscada.position.y - o.position.y, buscada.position.x - o.position.x) : -Math.PI / 2;
  let d = obj - brujula; d -= TAU * Math.round(d / TAU);
  brujula += d * 0.08;
}

// ---------- NOVA completo: se van al centro y la O gira 360°, palpita, gira 360°… ----------
let destinoLogo = null;
function empezarLogo() {
  lectura = true; lecturaT = 1; logoT0 = t; brujula = -Math.PI / 2; buscada = null;
  // las uniones ya cumplieron: se quitan para que no tiren mientras las letras se acomodan
  vinculos.forEach(v => Composite.remove(world, v.c));
  soltarMouse(0); mc.collisionFilter.mask = 0; // el logo ya no se arrastra (R reinicia)
  // destino: la palabra centrada, cada glifo en su lugar como si se escribiera "NOVA"
  // la O lleva un 30 % más de espacio: sus puntas de afuera sobresalen del aro
  const anchos = [...'NOVA'].map(c => { ctx.font = `700 ${F}px ${c === 'O' ? FUENTE : FUENTE_DECO}`; return ctx.measureText(c).width * (c === 'O' ? 1.3 : 1); }), total = anchos.reduce((a, b) => a + b);
  let x = W / 2 - total / 2;
  destinoLogo = {};
  [...'NOVA'].forEach((c, i) => { destinoLogo[c] = { x: x + anchos[i] / 2, y: H * 0.42 }; x += anchos[i]; });
}
function pasoLogo() {
  for (const l of letras) {
    const d = destinoLogo[l.ch];
    const objetivo = { x: d.x - l.off.x, y: d.y - l.off.y }; // posición del cuerpo para que el glifo quede en d
    Body.setAngle(l, angNorm(l.angle) * (1 - R.llegarLogo * 1.5));
    Body.setPosition(l, Vector.add(l.position, Vector.mult(Vector.sub(objetivo, l.position), R.llegarLogo)));
    Body.setVelocity(l, { x: 0, y: 0 }); Body.setAngularVelocity(l, 0);
    l.oro += (1 - l.oro) * 0.08; l.dormida *= 0.9; l.chispa *= 0.93;
  }
  lecturaT *= 0.97;
  pasoGremio(grupos());
  pasoIconos();
}
// ciclo de la O: gira 360° (1.4 s), palpita dos veces (1 s), descansa (0.8 s)
function animO() {
  if (!lectura) return { giro: 0, s: 1 };
  const u = (t - logoT0 - 1.2) % 3.2; // 1.2 s para que primero lleguen al centro
  if (t - logoT0 < 1.2) return { giro: 0, s: 1 };
  if (u < 1.4) { const k = u / 1.4; return { giro: TAU * (k < .5 ? 2 * k * k : 1 - (-2 * k + 2) ** 2 / 2), s: 1 }; }
  if (u < 2.4) { const k = (u - 1.4) / 1.0; return { giro: 0, s: 1 + 0.13 * Math.abs(Math.sin(k * TAU)) * (1 - k * 0.35) }; }
  return { giro: 0, s: 1 };
}

// El gremio: cada letra pequeña percibe los grupos cercanos (más grandes = se notan desde más lejos).
function pasoGremio(gs) {
  const fs = F * 0.17;
  let anchoSub = 0; ctx.font = `500 ${fs}px ${FUENTE}`;
  const avance = []; for (const c of SUB) { avance.push(anchoSub); anchoSub += ctx.measureText(c).width + fs * 0.12; }
  let base = null;
  if (lectura) {
    const s = [...letras].sort((a, b) => a.position.x - b.position.x);
    const cx = (s[0].position.x + s[3].position.x) / 2;
    const y = Math.max(...letras.map(l => l.bounds.max.y)) + fs * 1.4;
    base = { x: cx - anchoSub / 2, y: Math.min(y, H - fs * 0.8) };
  }
  for (const g of gremio) {
    let dx = 0, dy = 0, vmax = 2.2, fmax = 0.12;
    if (base) {
      // lectura: cada una va a su lugar en "GREMIO DE AVENTUREROS" (arrive)
      const tx = base.x + avance[g.idx], ty = base.y;
      dx = tx - g.x; dy = ty - g.y; const d = Math.hypot(dx, dy);
      vmax = d < 80 ? 4 * d / 80 : 4; fmax = 0.35;
      steerTo(g, dx, dy, vmax, fmax); g.ang *= 0.9;
    } else {
      // busca el grupo más grande que percibe (los solos no atraen a nadie)
      let mejor = null, mejorS = 0;
      for (const gr of gs) {
        if (gr.length < 2) continue;
        const c = centro(gr), d = Math.hypot(c.x - g.x, c.y - g.y);
        if (d < R.percepcionGremio + 90 * gr.length && gr.length > mejorS) { mejor = c; mejorS = gr.length; }
      }
      if (mejor) {
        // rodean al grupo: cada una en su ángulo, girando despacio
        const a = g.k / gremio.length * TAU + t * 0.3, rr = F * (0.55 + 0.22 * mejorS);
        dx = mejor.x + Math.cos(a) * rr - g.x; dy = mejor.y + Math.sin(a) * rr * 0.7 - g.y;
        steerTo(g, dx, dy, 3, 0.15);
      } else {
        // wander por el suelo
        g.a += (Math.random() - 0.5) * 0.3;
        steerTo(g, Math.cos(g.a) * 30, (H - fs * 0.7) - g.y, 1.1, 0.06);
      }
      g.ang += (Math.max(-0.4, Math.min(0.4, g.vx * 0.08)) - g.ang) * 0.1;
    }
    // separación entre letras pequeñas
    for (const o of gremio) {
      if (o === g) continue;
      const sx = g.x - o.x, sy = g.y - o.y, d2 = sx * sx + sy * sy;
      if (d2 > 0 && d2 < (fs * 0.9) ** 2) { g.vx += sx / d2 * 2; g.vy += sy / d2 * 2; }
    }
    g.x += g.vx; g.y += g.vy;
    if (g.x < 10) { g.x = 10; g.vx = Math.abs(g.vx); g.a = 0; }
    if (g.x > W - 10) { g.x = W - 10; g.vx = -Math.abs(g.vx); g.a = Math.PI; }
    if (g.y > H - fs * 0.4) { g.y = H - fs * 0.4; g.vy = 0; }
  }
}
function steerTo(g, dx, dy, vmax, fmax) {
  const m = Math.hypot(dx, dy) || 1;
  let sx = dx / m * vmax - g.vx, sy = dy / m * vmax - g.vy;
  const f = Math.hypot(sx, sy); if (f > fmax) { sx *= fmax / f; sy *= fmax / f; }
  g.vx += sx; g.vy += sy;
  const v = Math.hypot(g.vx, g.vy); if (v > vmax + 0.5) { g.vx *= (vmax + 0.5) / v; g.vy *= (vmax + 0.5) / v; }
}

// ---------- dibujo: todo lo que se ve son letras ----------
// Plata metálica como la del logo (degradado vertical con un quiebre oscuro a media altura).
// Dormida: se apaga hacia gris; en grupo conserva la plata y la delata el halo dorado.
function plata(l) {
  const g = ctx.createLinearGradient(0, -capH * 0.55, 0, capH * 0.55);
  const s = 1 - l.dormida * 0.55, c = (r, gg, b) => `rgb(${Math.round(r * s)},${Math.round(gg * s)},${Math.round(b * s)})`;
  g.addColorStop(0, c(255, 255, 255)); g.addColorStop(0.42, c(214, 219, 227));
  g.addColorStop(0.55, c(150, 158, 171)); g.addColorStop(1, c(238, 241, 246));
  return g;
}
// Oro del emblema: degradado diagonal claro → ocre → claro.
function oro(r, apagado = 0) {
  const g = ctx.createLinearGradient(-r, -r, r, r), s = 1 - apagado * 0.5;
  const c = (a, b, d) => `rgb(${Math.round(a * s)},${Math.round(b * s)},${Math.round(d * s)})`;
  g.addColorStop(0, c(246, 231, 176)); g.addColorStop(0.45, c(206, 168, 86));
  g.addColorStop(0.7, c(150, 112, 44)); g.addColorStop(1, c(233, 206, 134));
  return g;
}
function dibujar() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const fondo = ctx.createRadialGradient(W / 2, H * 0.45, 0, W / 2, H * 0.45, Math.max(W, H) * 0.75);
  fondo.addColorStop(0, lectura ? '#1d2a42' : '#18223a'); fondo.addColorStop(1, '#0c1220');
  ctx.fillStyle = fondo; ctx.fillRect(0, 0, W, H);

  // gremio
  const fs = F * 0.17;
  ctx.font = `500 ${fs}px ${FUENTE}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const g of gremio) {
    ctx.save(); ctx.translate(g.x, g.y); ctx.rotate(g.ang);
    ctx.fillStyle = lectura ? '#dfe3ea' : '#8d97ab';
    ctx.fillText(g.ch, 0, 0); ctx.restore();
  }

  dibujarIconos();

  // letras grandes
  for (const l of letras) {
    ctx.font = `700 ${F}px ${l.ch === 'O' ? FUENTE : FUENTE_DECO}`;
    const n = l.grupo ? l.grupo.length : 1;
    ctx.save();
    // rechazada: tiembla un instante
    const tiembla = l.rechazo > 0.05 ? Math.sin(t * 70) * 7 * l.rechazo : 0;
    ctx.translate(l.position.x + tiembla, l.position.y); ctx.rotate(l.angle); ctx.translate(l.off.x, l.off.y);
    ctx.shadowColor = ORO; ctx.shadowBlur = n > 1 ? 10 + 12 * n + 30 * l.chispa + 40 * lecturaT : 0;
    // la que señala la brújula brilla en plata, latiendo suave
    if (l === buscada) { ctx.shadowColor = PLATA; ctx.shadowBlur = 14 + 10 * Math.sin(t * 4); }
    if (l.ch === 'O' && lectura) ctx.shadowBlur *= animO().s;
    if (l.ch === 'O') dibujarO(l); else { ctx.fillStyle = plata(l); letra(l.ch); }
    ctx.restore();
  }
  if (panel.classList.contains('on')) actualizarPanel();
}
// baseline alfabética, bajada media altura de mayúscula: el glifo queda centrado en su cuerpo
function letra(ch) { ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'center'; ctx.fillText(ch, 0, capH / 2); }

// ---------- la O: el emblema de NOVA, armado solo con letras ----------
//   aro ............ la O
//   rombos (N/E/S/O) una A pequeña sobre una V pequeña (◆ = Δ + ∇)
//   puntas de afuera V delgadas
//   bloques ........ letras I entre el aro y la estrella, en las diagonales
//   estrella ....... 8 V muy afiladas, cada una con una mitad clara y otra oscura (las facetas)
// La estrella es la aguja: gira hacia la letra que toca; su punta principal es más clara.
// Glifo `ch` (Cinzel) de altura `alto`, apuntando en la dirección `a`, con el vértice a distancia `r` del centro.
function glifoRadial(ch, a, r, alto, ancho, estilo, faceta) {
  ctx.save();
  ctx.rotate(a - Math.PI / 2);                    // +y local = dirección a
  ctx.translate(0, r - alto / 2);
  const sx = ancho / capH, sy = alto / capH;
  ctx.scale(sx, ch === 'A' ? -sy : sy);           // la A se voltea para que su vértice también apunte hacia afuera
  ctx.font = `700 ${F}px ${FUENTE}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = estilo; ctx.fillText(ch, 0, 0);
  if (faceta) { ctx.beginPath(); ctx.rect(0, -capH, capH, capH * 2); ctx.clip(); ctx.fillStyle = faceta; ctx.fillText(ch, 0, 0); }
  ctx.restore();
}
function dibujarO(l) {
  const anim = animO(), h = capH, ap = l.dormida;
  ctx.rotate(anim.giro); ctx.scale(anim.s, anim.s); // con NOVA completo: gira 360° y palpita
  const g = oro(h * 0.6, ap);
  // aro
  ctx.font = `700 ${F}px ${FUENTE}`; ctx.fillStyle = g; letra('O');
  ctx.shadowBlur = 0;
  const claro = ap > 0.5 ? '#8b7a52' : '#f7ecc4', oscuro = ap > 0.5 ? '#5e5132' : '#a07a35';
  for (let i = 0; i < 4; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 2;
    // puntas de afuera: largas arriba y abajo, cortas y anchas a los lados (como en el emblema)
    const lateral = i % 2 === 1;
    glifoRadial('V', a, h * (lateral ? 0.66 : 0.7), h * (lateral ? 0.16 : 0.2), h * (lateral ? 0.16 : 0.09), g);
    // rombo sobre el aro: Δ (A volteada hacia afuera) + ∇ (V hacia adentro)
    glifoRadial('A', a, h * 0.565, h * 0.1, h * 0.075, g);  // angostas: los trazos se juntan y el rombo se ve macizo
    glifoRadial('V', a + Math.PI, -h * 0.365, h * 0.1, h * 0.075, g);
    // diagonales: punta corta afuera y dos bloques (I) adentro
    const d = a + Math.PI / 4;
    glifoRadial('V', d, h * 0.6, h * 0.08, h * 0.07, g);
    for (const s of [-0.13, 0.13]) glifoRadial('I', d + s, h * 0.4, h * 0.12, h * 0.11, g);
  }
  // estrella = aguja (no gira con el aro: apunta a su objetivo)
  ctx.rotate(-l.angle); // deshace el ángulo del cuerpo (el giro del logo sí se conserva)
  // primero las diagonales (más cortas) y encima las cardinales, con la principal al final
  const puntas = [[Math.PI / 4, 0.3], [3 * Math.PI / 4, 0.3], [-Math.PI / 4, 0.3], [-3 * Math.PI / 4, 0.3],
    [Math.PI, 0.39], [Math.PI / 2, 0.39], [-Math.PI / 2, 0.39], [0, 0.39]];
  for (const [o, r] of puntas) {
    const principal = o === 0;
    glifoRadial('V', brujula + o, h * r, h * r * 0.95, h * (r > 0.35 ? 0.15 : 0.12),
      principal ? '#fff6d8' : oscuro, principal ? '#ffffff' : claro);
  }
}

function actualizarPanel() {
  const gs = grupos();
  panel.innerHTML = `<div>grupos: <b>${gs.map(g => g.map(l => l.ch).join('')).join(' · ')}</b></div>
    <div>vínculos: <b>${vinculos.length}</b></div>
    <div>dormidas: <b>${letras.filter(l => l.dormida > 0.5).map(l => l.ch).join(' ') || '—'}</b></div>
    <div>la brújula busca: <b>${buscada ? buscada.ch : '—'}</b></div>
    <div>NOVA completo: <b>${lectura ? 'sí' : 'no'}</b></div>
    <div style="opacity:.6;margin-top:6px">D panel · R reiniciar · doble clic: soltar una letra</div>`;
}

// ---------- entrada ----------
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'd') panel.classList.toggle('on');
  if (k === 'r') { crearLetras(); crearGremio(); }
});
// si el tamaño cambia mucho, las letras se rehacen con las medidas nuevas
addEventListener('resize', () => { const F0 = F; medir(); construirParedes(); if (Math.abs(F - F0) > F0 * 0.2) { crearLetras(); crearGremio(); } });

// ---------- inicio y bucle (paso fijo 60 Hz) ----------
medir(); construirParedes(); crearLetras(); crearGremio();
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(0.1, (now - last) / 1000); last = now;
  let n = 0;
  while (acc >= 1 / 60 && n < 3) { Engine.update(engine, 1000 / 60); paso(); acc -= 1 / 60; n++; }
  dibujar();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__nova = { R, get buscada() { return buscada; }, animO, get letras() { return letras; }, get vinculos() { return vinculos; }, get lectura() { return lectura; }, gremio: () => gremio, engine, paso, dibujar, Body, grupos };
})();
</script>
</body>
