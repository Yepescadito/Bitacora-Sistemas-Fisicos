<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Bus Kuramoto — Completo (RK4)</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.6.0/lib/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.39/Tone.min.js"></script>
  <style>
    body { margin:0; background:#111; color:#eee; font-family:sans-serif; }
    #ui { position:fixed; left:0; right:0; bottom:0; background:rgba(20,20,20,0.95); padding:10px; display:flex; gap:12px; align-items:center; }
    .ctrl { color:#ddd; font-size:13px; display:flex; gap:6px; align-items:center; }
    input[type=range] { width:160px; }
    button { padding:8px 12px; font-size:14px; cursor:pointer; }
    #state { padding:6px 10px; border-radius:6px; font-weight:700; }
  </style>
</head>
<body>
<div id="ui">
  <div class="ctrl">K: <input id="K" type="range" min="0" max="5" step="0.01" value="1.8"></div>
  <div class="ctrl">D (diversidad): <input id="D" type="range" min="0" max="2" step="0.01" value="0.4"></div>
  <div class="ctrl">r_partial: <input id="rP" type="range" min="0" max="1" step="0.01" value="0.45"></div>
  <div class="ctrl">r_stable: <input id="rS" type="range" min="0" max="1" step="0.01" value="0.75"></div>
  <div class="ctrl"><button id="brake">🚌 FRENAR</button></div>
  <div class="ctrl">Estado: <div id="state" style="margin-left:6px;">—</div></div>
  <div style="flex:1"></div>
  <div class="ctrl">Seleccionar pasajero: click sobre él</div>
</div>

<script>
/* ========== Config y Kuramoto RK4 ========== */
const N = 8;
class Kuramoto {
  constructor(N, K=1.8, baseOmega=1.0, diversity=0.4){
    this.N = N;
    this.K = K;
    this.theta = new Array(N);
    this.omega = new Array(N);
    this.targetOmega = new Array(N);
    this.baseOmega = baseOmega;
    this.diversity = diversity;
    for (let i=0;i<N;i++){
      this.theta[i] = Math.random()*Math.PI*2;
      this.omega[i] = baseOmega + (Math.random()-0.5)*diversity;
      this.targetOmega[i] = this.omega[i];
    }
  }
  setK(k){ this.K = k; }
  setD(d){
    this.diversity = d;
    for (let i=0;i<this.N;i++){
      const seedOffset = ( (i+1)*137 % 23 )/23 - 0.5;
      this.targetOmega[i] = this.baseOmega + seedOffset * d;
    }
  }
  smoothOmega(dt){
    const tau = 0.5;
    const alpha = 1 - Math.exp(-dt/tau);
    for (let i=0;i<this.N;i++){
      this.omega[i] += (this.targetOmega[i] - this.omega[i]) * alpha;
    }
  }
  derivatives(thetas){
    const d = new Array(this.N).fill(0);
    for (let i=0;i<this.N;i++){
      let sum = 0;
      for (let j=0;j<this.N;j++){
        sum += Math.sin(thetas[j]-thetas[i]);
      }
      d[i] = this.omega[i] + (this.K/this.N)*sum;
    }
    return d;
  }
  step(dt){
    const n = this.N;
    const th = this.theta;
    const k1 = this.derivatives(th);
    const th2 = new Array(n);
    for (let i=0;i<n;i++) th2[i] = th[i] + 0.5*dt*k1[i];
    const k2 = this.derivatives(th2);
    const th3 = new Array(n);
    for (let i=0;i<n;i++) th3[i] = th[i] + 0.5*dt*k2[i];
    const k3 = this.derivatives(th3);
    const th4 = new Array(n);
    for (let i=0;i<n;i++) th4[i] = th[i] + dt*k3[i];
    const k4 = this.derivatives(th4);
    for (let i=0;i<n;i++){
      this.theta[i] += (dt/6)*(k1[i] + 2*k2[i] + 2*k3[i] + k4[i]);
      this.theta[i] = this.theta[i] % (Math.PI*2);
      if (this.theta[i] < 0) this.theta[i] += Math.PI*2;
    }
    this.smoothOmega(dt);
  }
  orderParameter(){
    let x=0,y=0;
    for (let i=0;i<this.N;i++){ x += Math.cos(this.theta[i]); y += Math.sin(this.theta[i]); }
    x/=this.N; y/=this.N;
    return { r: Math.hypot(x,y), psi: Math.atan2(y,x) };
  }
}

/* ========== Agentes y mapeos visuales/sonoros ========== */
let system;
let agents = [];
const roles = [
  {name:'Dormido1', seatRow:0, seatCol:0},
  {name:'Celular1', seatRow:0, seatCol:1},
  {name:'Musica1', seatRow:0, seatCol:2},
  {name:'Dormido2', seatRow:0, seatCol:3},
  {name:'Celular2', seatRow:2, seatCol:0},
  {name:'Musica2', seatRow:2, seatCol:1},
  {name:'Inquieto', seatRow:2, seatCol:2},
  {name:'Vendedor', seatRow:1, seatCol:0}
];

let startedAudio = false;

/* util: phase crossing detection (mod 2pi) */
function crossed(oldPhase, newPhase, targetAngle, window=0.2){
  let a = (oldPhase + 2*Math.PI) % (2*Math.PI);
  let b = (newPhase + 2*Math.PI) % (2*Math.PI);
  if (b < a) b += 2*Math.PI;
  const t = targetAngle;
  for (let k=0;k<2;k++){
    const tt = t + k*Math.PI*2;
    if ( (tt >= a - window) && (tt <= b + window) ) return true;
  }
  return false;
}

function createAgentsFromSystem(sys){
  agents = [];
  for (let i=0;i<sys.N;i++){
    const role = roles[i];
    agents.push({
      id: i,
      name: role.name,
      seatRow: role.seatRow,
      seatCol: role.seatCol,
      lastTheta: sys.theta[i],
      hover:false,
      selected:false,
      voice: null
    });
  }
}

/* ========== p5 + UI ========== */
let canvas;
function setup(){
  canvas = createCanvas(windowWidth, windowHeight-100);
  canvas.mousePressed(handleCanvasClick);
  system = new Kuramoto(N, parseFloat(select('#K').value()), 1.0, parseFloat(select('#D').value()));
  createAgentsFromSystem(system);
  frameRate(60);

  select('#K').input(()=>{ system.setK(parseFloat(select('#K').value())); });
  select('#D').input(()=>{ system.setD(parseFloat(select('#D').value())); });
  select('#rP').input(()=>{});
  select('#rS').input(()=>{});
  select('#brake').mousePressed(()=>{ applyBrake(); });

  getAudioVoices();
}

function makeVoiceForAgent(name){
  if (name.startsWith('Dormido')) return new Tone.Synth({ oscillator:{type:'sine'}, envelope:{attack:0.01, decay:0.2, sustain:0.1, release:0.5} });
  if (name.startsWith('Celular')) return new Tone.MembraneSynth();
  if (name.startsWith('Musica'))  return new Tone.AMSynth({harmonicity:2, modulationIndex:8});
  if (name === 'Inquieto')        return new Tone.FMSynth();
  if (name === 'Vendedor')        return new Tone.NoiseSynth();
  return null;
}

function getAudioVoices(){
  // One voice per passenger. Two passengers sharing a monophonic synth made
  // simultaneous phase-crossings collide inside Tone.js and throw, which aborted
  // draw() mid-frame and blanked the canvas.
  const out = new Tone.Gain(0.35).toDestination();
  for (let a of agents){
    const v = makeVoiceForAgent(a.name);
    if (v){ v.connect(out); a.voice = v; }
  }
}

function ensureAudioStarted(){
  if (!startedAudio){
    Tone.start();
    startedAudio = true;
  }
}

function applyBrake(){
  ensureAudioStarted();
  // Global hard brake: jolt every passenger out of rhythm so synchrony (r)
  // visibly collapses, then watch the coupling pull the bus back together.
  const TAU = Math.PI * 2;
  for (let i=0;i<system.N;i++){
    system.theta[i] = Math.random() * TAU;
  }
  // Re-baseline crossing detection so the jump itself doesn't fire a burst of notes.
  for (let a of agents) a.lastTheta = system.theta[a.id];
  flashTimer = 0.25;
}

function handleCanvasClick(){
  ensureAudioStarted();
  const mx = mouseX, my = mouseY;
  for (let a of agents){
    const pos = agentScreenPos(a);
    const d = dist(mx, my, pos.x, pos.y);
    if (d < 28){
      a.selected = !a.selected;
      if (a.selected){
        const delta = (Math.random()-0.5) * Math.PI/1.2;
        let t = (system.theta[a.id] + delta) % (2*Math.PI);
        if (t < 0) t += 2*Math.PI;
        system.theta[a.id] = t;
        a.lastTheta = t;
        triggerAgentEvent(a, 'perturb');
      }
    }
  }
}

function busLayout(){
  const margin = 60;
  const w = width - margin*2;
  const h = height - margin*2;
  const bus = { x:margin, y:margin, w:w, h:h };
  return bus;
}

function agentScreenPos(agent){
  const bus = busLayout();
  const seatW = bus.w * 0.18;
  const seatH = 60;
  if (agent.name === 'Vendedor'){
    const idx = agent.id;
    const theta = system.theta[idx];
    const t = (theta % (2*Math.PI)) / (2*Math.PI);
    const aisleX = bus.x + bus.w*0.55;
    const minY = bus.y + seatH;
    const maxY = bus.y + bus.h - seatH;
    const y = lerp(minY, maxY, t);
    const x = aisleX;
    return {x,y};
  } else {
    if (agent.seatRow === 0){
      const cols = 4;
      const gap = bus.w*0.02;
      const startX = bus.x + bus.w*0.08;
      const x = startX + agent.seatCol*( (bus.w*0.7 - gap*(cols-1)) / cols ) + 30;
      const y = bus.y + 60;
      return {x,y};
    } else {
      const cols = 3;
      const gap = bus.w*0.02;
      const startX = bus.x + bus.w*0.08;
      const x = startX + agent.seatCol*( (bus.w*0.7 - gap*(cols-1)) / cols ) + 40;
      const y = bus.y + bus.h - 100;
      return {x,y};
    }
  }
}

function triggerAgentEvent(agent, reason='phase'){
  const v = agent.voice;
  if (!v) return;
  try {
    if (agent.name.startsWith('Dormido')){
      if (reason==='phase'){
        const freq = 150 + 40*agent.id;
        v.triggerAttackRelease(freq, '8n');
      } else if (reason==='perturb'){
        v.triggerAttackRelease(220, '16n');
      }
    } else if (agent.name.startsWith('Celular')){
      if (reason==='phase') v.triggerAttackRelease('C4', '16n');
      else v.triggerAttackRelease('G4', '32n');
    } else if (agent.name.startsWith('Musica')){
      if (reason==='phase') v.triggerAttackRelease('E4', '8n');
      else v.triggerAttackRelease('B3', '16n');
    } else if (agent.name === 'Inquieto'){
      if (reason==='phase') v.triggerAttackRelease('A3', '16n');
      else v.triggerAttackRelease('A4', '8n');
    } else if (agent.name === 'Vendedor'){
      if (reason==='phase') {
        v.triggerAttackRelease('32n');
      } else v.triggerAttackRelease('16n');
    }
  } catch (e) {
    // Tone.js throws if a monophonic voice is retriggered at the same audio
    // time; swallow it so sound scheduling can never abort the rendered frame.
  }
}

let flashTimer = 0;
function draw(){
  background(18);
  const bus = busLayout();

  let dt = deltaTime/1000;
  if (!isFinite(dt) || dt<=0) dt = 1/60;
  dt = Math.min(dt, 0.1); // cap catch-up so returning to a hidden tab can't freeze in a huge synchronous loop
  const maxStep = 0.02;
  const steps = Math.max(1, Math.ceil(dt / maxStep));
  const stepDt = dt / steps;
  for (let i=0;i<steps;i++) system.step(stepDt);

  noStroke();
  fill(30);
  rect(bus.x, bus.y, bus.w, bus.h, 12);
  fill(60);
  rect(bus.x+bus.w*0.05, bus.y+20, bus.w*0.9, 16, 6);

  for (let a of agents){
    const p = agentScreenPos(a);
    push();
    translate(p.x, p.y);
    const th = system.theta[a.id];
    noStroke();
    fill(200);
    ellipse(0,0,36,36);
    // phase indicator: small line showing theta direction
    stroke(40);
    strokeWeight(2);
    const angLine = th - Math.PI/2;
    const lx = Math.cos(angLine) * 14;
    const ly = Math.sin(angLine) * 14;
    line(0,0, lx, ly);
    noStroke();
    if (a.name === 'Dormido1'){
      const t = Math.sin(th);
      push();
      translate(0, -4 + 6 * t);
      rotate(0.2 * Math.sin(th));
      fill(170);
      rect(-8, 6, 16, 8, 4);
      pop();
      fill(30);
      arc(-6,-2,8,4, PI, 0);
      arc(6,-2,8,4, PI, 0);
    } else if (a.name === 'Dormido2'){
      const incline = map(Math.sin(th), -1,1,-6,6);
      push(); translate(0, incline);
      fill(180);
      rect(-10,6,20,8,4);
      pop();
    } else if (a.name.startsWith('Celular')){
      const show = Math.cos(th) < 0;
      fill(show?20:100);
      rect(-6,2,12,18,3);
    } else if (a.name.startsWith('Musica')){
      fill(140);
      arc(-10,-4,12,12, PI/2, 3*PI/2);
      arc(10,-4,12,12, -PI/2, PI/2);
      const headTilt = 6 * Math.sin(th);
      fill(220);
      ellipse(0, headTilt, 8, 8);
    } else if (a.name === 'Inquieto'){
      const leg = 8 * Math.abs(Math.sin(4*th));
      fill(150);
      rect(-2,12,4,leg,2);
    } else if (a.name === 'Vendedor'){
      fill(255,200,100);
      rect(-12,8,24,10,4);
    }
    if (a.selected){
      stroke(255,200,0);
      strokeWeight(2);
      noFill();
      ellipse(0,0,44,44);
    }
    // debug small labels: theta (rad) and omega
    fill(180);
    textSize(10);
    textAlign(CENTER,TOP);
    const thLabel = (th).toFixed(2);
    const om = system.omega[a.id] ? system.omega[a.id].toFixed(2) : '?.?';
    text(`${thLabel}\n${om}`, 0, 20);
    pop();
  }

  const centerX = width - 160;
  const centerY = 120;
  const R = 60;
  noFill();
  stroke(120);
  ellipse(centerX, centerY, R*2, R*2);
  const op = system.orderParameter();
  for (let i=0;i<system.N;i++){
    const ang = system.theta[i] - Math.PI/2;
    const x = centerX + Math.cos(ang)*R;
    const y = centerY + Math.sin(ang)*R;
    noStroke();
    fill(lerpColor(color('#ff6b6b'), color('#6bafff'), i/(N-1)));
    ellipse(x,y,10,10);
  }
  noStroke();
  fill(80,200,120,140);
  ellipse(centerX, centerY, op.r*R*2, op.r*R*2);
  fill(220);
  textSize(13);
  textAlign(CENTER,CENTER);
  text('r: ' + op.r.toFixed(3), centerX, centerY + R + 18);

  const rP = parseFloat(select('#rP').value());
  const rS = parseFloat(select('#rS').value());
  const st = select('#state');
  if (op.r < rP) { st.html('🔴 DESORDEN'); st.style('background','#6b1b1b'); st.style('color','#ffd9d9'); }
  else if (op.r < rS) { st.html('🟡 ORGANIZACIÓN PARCIAL'); st.style('background','#695b18'); st.style('color','#fff8d6'); }
  else { st.html('🟢 ORGANIZACIÓN ESTABLE'); st.style('background','#124b24'); st.style('color','#d9ffea'); }

  noStroke(); fill(200); textSize(12); textAlign(LEFT,CENTER);
  text('BUS — 8 pasajeros', bus.x + 12, bus.y + 12);

  if (flashTimer > 0){
    flashTimer -= deltaTime/1000;
    push();
    fill(255, 200, 60, 80);
    rect(0,0,width,height);
    pop();
  }

  // Sound is triggered after everything is drawn, so a Tone.js hiccup can never
  // leave a blank frame.
  updatePhaseSounds();
}

const PHASE_ANGLES_4 = [0, Math.PI/2, Math.PI, 3*Math.PI/2];
const PHASE_ANGLES_8 = [0, Math.PI/4, Math.PI/2, 3*Math.PI/4, Math.PI, 5*Math.PI/4, 3*Math.PI/2, 7*Math.PI/4];
function updatePhaseSounds(){
  for (let a of agents){
    const oldT = a.lastTheta;
    const newT = system.theta[a.id];
    const angles = (a.name === 'Vendedor') ? PHASE_ANGLES_8 : PHASE_ANGLES_4;
    for (let ang of angles){
      if (crossed(oldT, newT, ang, 0.12)){
        triggerAgentEvent(a, 'phase'); // at most one note per passenger per frame
        break;
      }
    }
    a.lastTheta = newT;
  }
}

function windowResized(){
  resizeCanvas(windowWidth, windowHeight-100);
}

function lerpColor(a,b,t){
  return color( (1-t)*red(a) + t*red(b), (1-t)*green(a)+t*green(b), (1-t)*blue(a)+t*blue(b) );
}

</script>
</body>
</html>
